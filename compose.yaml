name: aja-digital-full

include:
  - path: ./backend/compose.integrated.yaml
    env_file: ./backend/env.integrated.example

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${CORE_PUBLIC_API_URL:-http://127.0.0.1:3002/api/v1}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  default:
    ipam:
      config:
        - subnet: ${AJA_FULL_SUBNET:-10.240.232.0/24}
